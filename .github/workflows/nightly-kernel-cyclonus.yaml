name: Nightly AL2023 Kernel Cyclonus Tests

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * *"

permissions:
  id-token: write
  contents: read

concurrency:
  group: nightly-al2023-kernel-cyclonus
  cancel-in-progress: false

env:
  REGION: us-west-2
  INSTANCE_TYPE: t3.large

jobs:
  discover:
    if: github.repository == 'aws/aws-network-policy-agent'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: aws-actions/configure-aws-credentials@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          role-to-assume: ${{ secrets.OSS_ROLE_ARN }}
          aws-region: ${{ env.REGION }}
      - id: matrix
        name: Discover kernel matrix
        run: |
          matrix=$(./scripts/smoke/eks-kernel-matrix/run.sh | jq -c .)
          [[ $(jq length <<<"$matrix") -gt 0 ]]
          echo "value=$matrix" >> "$GITHUB_OUTPUT"

  build:
    if: github.repository == 'aws/aws-network-policy-agent'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image_uri }}
    steps:
      - uses: actions/checkout@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: aws-actions/configure-aws-credentials@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          role-to-assume: ${{ secrets.OSS_ROLE_ARN }}
          aws-region: ${{ env.REGION }}
      - id: image
        uses: ./.github/actions/build-and-push-image
        with:
          aws-region: ${{ env.REGION }}

  test:
    needs: [discover, build]
    if: github.repository == 'aws/aws-network-policy-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(needs.discover.outputs.matrix || '[]') }}
        ip-family: [IPv4, IPv6]
    env:
      IP_FAMILY: ${{ matrix.ip-family }}
      K8S_VERSION: ${{ matrix.candidate.kubernetes_version }}
      KERNEL_VERSION: ${{ matrix.candidate.kernel_version }}
      KERNEL_LINE: ${{ matrix.candidate.kernel_line }}
      AMI_ID: ${{ matrix.candidate.image_id }}
      KUBECONFIG: ${{ github.workspace }}/.kube/config
    steps:
      - uses: actions/checkout@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./.github/actions/install-dependencies
      - uses: aws-actions/configure-aws-credentials@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          role-to-assume: ${{ secrets.OSS_ROLE_ARN }}
          aws-region: ${{ env.REGION }}
          role-duration-seconds: 21600

      - name: Set cluster name
        run: |
          echo "CLUSTER_NAME=npa-nightly-k${KERNEL_LINE//./-}-${IP_FAMILY,,}-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Create cluster
        run: |
          cat >/tmp/cluster.yaml <<EOF
          apiVersion: eksctl.io/v1alpha5
          kind: ClusterConfig
          metadata:
            name: ${CLUSTER_NAME}
            region: ${REGION}
            version: "${K8S_VERSION}"
          iam:
            withOIDC: true
          kubernetesNetworkConfig:
            ipFamily: ${IP_FAMILY}
          autoModeConfig:
            enabled: false
          addons:
            - name: vpc-cni
            - name: coredns
            - name: kube-proxy
          managedNodeGroups:
            - name: ${CLUSTER_NAME}-ng
              amiFamily: AmazonLinux2023
              ami: ${AMI_ID}
              instanceType: ${INSTANCE_TYPE}
              desiredCapacity: 3
              minSize: 1
              maxSize: 3
          EOF
          eksctl create cluster -f /tmp/cluster.yaml
          mkdir -p "$(dirname "$KUBECONFIG")"
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$REGION" --kubeconfig "$KUBECONFIG"

      - name: Verify nodes
        run: |
          nodes=$(kubectl get nodes -o json)
          mapfile -t instances < <(jq -r '.items[].spec.providerID | split("/")[-1]' <<<"$nodes")
          [[ ${#instances[@]} -gt 0 ]]

          amis=$(aws ec2 describe-instances --instance-ids "${instances[@]}" --region "$REGION" \
            | jq -c '[.Reservations[].Instances[].ImageId] | unique')
          [[ $(jq length <<<"$amis") -eq 1 && $(jq -r '.[0]' <<<"$amis") == "$AMI_ID" ]]

          bad=$(jq -r --arg expected "$KERNEL_VERSION" '
            .items[] | .status.nodeInfo.kernelVersion as $actual
            | select(($actual | sub("\\.x86_64$"; "")) != $expected)
            | "\(.metadata.name)=\($actual)"' <<<"$nodes")
          [[ -z "$bad" ]] || { echo "Unexpected node kernels: $bad" >&2; exit 1; }

      - name: Install addon and test image
        run: |
          cat >/tmp/addon.yaml <<EOF
          apiVersion: eksctl.io/v1alpha5
          kind: ClusterConfig
          metadata: {name: ${CLUSTER_NAME}, region: ${REGION}}
          addons:
            - name: vpc-cni
              version: latest
              configurationValues: '{"enableNetworkPolicy":"true"}'
              resolveConflicts: overwrite
          EOF
          eksctl update addon -f /tmp/addon.yaml --force
          kubectl set image daemonset/aws-node -n kube-system \
            aws-eks-nodeagent=${{ needs.build.outputs.image }}
          kubectl rollout status daemonset/aws-node -n kube-system --timeout=300s

      - name: Run Cyclonus suites
        env:
          ENABLE_STRICT_MODE: "true"
          RUN_EBPF_TESTS: "true"
          RUN_CLUSTER_NETWORK_POLICY_TESTS: "true"
        run: SKIP_ADDON_INSTALLATION=true ./scripts/run-cyclonus-tests.sh

  cleanup:
    needs: [discover, build, test]
    if: always() && needs.discover.result == 'success' && needs.test.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(needs.discover.outputs.matrix || '[]') }}
        ip-family: [IPv4, IPv6]
    env:
      IP_FAMILY: ${{ matrix.ip-family }}
      KERNEL_LINE: ${{ matrix.candidate.kernel_line }}
    steps:
      - uses: actions/checkout@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./.github/actions/install-dependencies
      - uses: aws-actions/configure-aws-credentials@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          role-to-assume: ${{ secrets.OSS_ROLE_ARN }}
          aws-region: ${{ env.REGION }}
          role-duration-seconds: 7200
      - name: Delete cluster
        run: |
          name=npa-nightly-k${KERNEL_LINE//./-}-${IP_FAMILY,,}-${GITHUB_RUN_ID}
          for attempt in 1 2 3; do
            eksctl delete cluster --name "$name" --region "$REGION" --disable-nodegroup-eviction && exit 0
            out=$(aws eks describe-cluster --name "$name" --region "$REGION" 2>&1) || true
            grep -q ResourceNotFoundException <<<"$out" && exit 0
            [[ $attempt -eq 3 ]] || sleep 30
          done
          echo "failed to delete $name" >&2
          exit 1
