name: Automatic Pull Request test

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
      - "release*"

permissions:
  contents: read

jobs:
  lint-ci:
    if: github.event_name == 'pull_request'
    name: Lint workflows and CI scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          # Full history so the changed-file diff below has the merge base.
          fetch-depth: 0
      - name: actionlint
        # Pre-existing workflows still reference older action versions, so the
        # runner-version rule is ignored; everything else (expressions, needs
        # cycles, matrix and syntax errors) gates the PR.
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color -ignore 'the runner of ".+" action is too old'
      - name: shellcheck changed scripts
        # Ratchet: lints every shell script this PR touches (shellcheck is
        # preinstalled on ubuntu runners). Pre-existing findings in untouched
        # scripts do not block; changing a script means bringing it clean or
        # adding a targeted, justified shellcheck directive.
        run: |
          mapfile -t scripts < <(git diff --name-only --diff-filter=d \
            "origin/${{ github.base_ref }}...HEAD" -- '*.sh')
          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "no shell scripts changed"; exit 0
          fi
          shellcheck -S warning "${scripts[@]}"
      - name: kernel matrix discovery offline test
        run: ./scripts/smoke/eks-kernel-matrix/test.sh

  unit-test:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest commit in the PR
        uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - uses: actions/cache@v3
        with:
          path: |
            ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-
      - name: Set up tools
        run: |
          go install golang.org/x/lint/golint@latest
          go install golang.org/x/tools/cmd/goimports@latest
      - name: Run code checks
        run: |
          make check-format
          make vet
      - name: Build
        run: make build-linux
      - name: Unit test
        run: make test
      - name: Upload code coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.txt
          disable_search: true
          flags: unittest
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
  docker-build:
    if: github.event_name == 'pull_request'
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest commit in the PR
        uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Network Policy Agent images
        run: make docker-buildx
  deprecated-apigroups:
    if: github.event_name == 'pull_request'
    name: Detect deprecated apiGroups
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: |
          version=$(curl -sL https://api.github.com/repos/FairwindsOps/pluto/releases/latest | jq -r ".tag_name")
          number=${version:1}
          wget https://github.com/FairwindsOps/pluto/releases/download/${version}/pluto_${number}_linux_amd64.tar.gz
          sudo tar -C /usr/local -xzf pluto_${number}_linux_amd64.tar.gz
      - run: |
          /usr/local/pluto detect-files -d .
  vuln_check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Go Version
        run: echo "GO_VERSION=$(cat .go-version)" >> $GITHUB_ENV
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - uses: actions/cache@v3
        with:
          path: |
            ~/go/bin
          key: ${{ runner.os }}-govulncheck-${{ hashFiles('.go-version') }}
          restore-keys: |
            ${{ runner.os }}-govulncheck-
      - name: Install `govulncheck`
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run `govulncheck`
        run: ~/go/bin/govulncheck ./...
